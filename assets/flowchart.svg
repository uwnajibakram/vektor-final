<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -90 1640 1410" width="2560" height="2200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css"><![CDATA[
      .bg { fill: #f8fafc; }
      .title { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 22px; font-weight: 650; fill: #0f172a; }
      .label { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 13px; fill: #1e293b; }
      .small { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 11px; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 5; }
      .box-power { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 5; }
      .box-switch { fill: #f8fafc; stroke: #64748b; stroke-width: 1.75; rx: 4; }
      .box-stepdown { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 4; }
      .box-fuse { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 4; }
      .line { stroke: #334155; stroke-width: 1.75; fill: none; }
      .line-power { stroke: #d97706; stroke-width: 2.25; fill: none; }
      .line-usb { stroke: #0284c7; stroke-width: 2; fill: none; }
      .pin { stroke: #475569; stroke-width: 1.25; fill: #f1f5f9; }
      .pin-label { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 9px; fill: #475569; }
      .arrow { marker-end: url(#ah); }
      .arrow-p { marker-end: url(#aho); }
      .arrow-u { marker-end: url(#ahu); }
      .net { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .net-motor-left { stroke: #0891b2; stroke-width: 1.5; fill: none; }
      .net-motor-right { stroke: #ea580c; stroke-width: 1.5; fill: none; }
      .net-motor-dash { stroke-dasharray: 9 6; }
      .net-i2c { stroke: #2563eb; stroke-width: 1.5; fill: none; }
      .rail-5v { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.25; }
      .rail-gnd { fill: #f1f5f9; stroke: #475569; stroke-width: 1.25; }
      .rail-cap { font-family: system-ui, -apple-system, Segoe UI, sans-serif; font-size: 10px; font-weight: 600; fill: #334155; }
    ]]></style>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#334155"/></marker>
    <marker id="aho" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#d97706"/></marker>
    <marker id="ahu" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0284c7"/></marker>
  </defs>

  <rect x="-120" y="-90" width="1640" height="1410" class="bg"/>

  <text x="700" y="60" text-anchor="middle" class="title">Mobile robot system architecture</text>

  <!-- Power: step-down on USB + Jetson; Arduino 5 V from Jetson; Cytron 24 V from spine -->
  <rect x="36" y="399" width="122" height="76" class="box-power"/>
  <text x="97" y="437" text-anchor="middle" class="label" font-weight="600" dominant-baseline="middle">24 V battery</text>

  <!-- Equal gaps (146/3 px); battery, fuse, switch share y=399 height=76; bus at y=437 -->
  <path d="M158 437 L206.667 437" class="line-power"/>
  <rect x="206.667" y="399" width="58" height="76" class="box-fuse"/>
  <text x="235.667" y="429" text-anchor="middle" class="small" font-size="9px" fill="#9a3412">40 A</text>
  <text x="235.667" y="445" text-anchor="middle" class="small" font-size="9px" fill="#9a3412">fuse</text>
  <path d="M264.667 437 L313.333 437" class="line-power"/>
  <rect x="313.333" y="399" width="56" height="76" class="box-switch"/>
  <text x="341.333" y="437" text-anchor="middle" class="small" font-size="10px" dominant-baseline="middle">Switch</text>

  <path d="M369.333 437 L418 437" class="line-power"/>
  <path d="M418 276 L418 735" class="line-power"/>
  <path d="M418 276 L470 276" class="line-power"/>
  <rect x="470" y="261" width="88" height="30" class="box-stepdown"/>
  <text x="514" y="280" text-anchor="middle" class="small" font-size="9px" fill="#92400e">Step-down</text>
  <path d="M558 276 L624 276" class="line-power arrow-p"/>

  <path d="M418 408 L470 408" class="line-power"/>
  <rect x="470" y="393" width="88" height="30" class="box-stepdown"/>
  <text x="514" y="412" text-anchor="middle" class="small" font-size="9px" fill="#92400e">Step-down</text>
  <path d="M558 408 L624 408" class="line-power arrow-p"/>
  <path d="M418 735 L624 735" class="line-power arrow-p"/>

  <text x="591" y="271" text-anchor="middle" class="small" fill="#b45309">12 V</text>
  <text x="591" y="403" text-anchor="middle" class="small" fill="#b45309">19 V</text>
  <text x="591" y="728" text-anchor="middle" class="small" fill="#b45309">24 V</text>

  <!-- Cameras -->
  <rect x="496" y="130" width="138" height="52" class="box"/>
  <text x="565" y="160" text-anchor="middle" class="label">Camera Left</text>
  <rect x="654" y="130" width="138" height="52" class="box"/>
  <text x="723" y="160" text-anchor="middle" class="label">Camera Front</text>
  <rect x="812" y="130" width="138" height="52" class="box"/>
  <text x="881" y="160" text-anchor="middle" class="label">Camera Rear</text>
  <rect x="970" y="130" width="138" height="52" class="box"/>
  <text x="1039" y="160" text-anchor="middle" class="label">Camera Right</text>

  <!-- USB bus -->
  <rect x="624" y="250" width="340" height="52" class="box"/>
  <text x="794" y="278" text-anchor="middle" class="label">USB bus</text>

  <path d="M565 220 L1039 220" class="line-usb"/>
  <path d="M794 220 L794 250" class="line-usb arrow-u"/>
  <path d="M565 182 L565 220" class="line-usb"/>
  <path d="M723 182 L723 220" class="line-usb"/>
  <path d="M881 182 L881 220" class="line-usb"/>
  <path d="M1039 182 L1039 220" class="line-usb"/>

  <!-- Jetson -->
  <rect x="624" y="382" width="340" height="52" class="box"/>
  <text x="794" y="410" text-anchor="middle" class="label">Jetson Orin Nano</text>

  <path d="M794 302 L794 382" class="line-usb arrow-u"/>

  <!-- Arduino / Cytron: RHS 18,19 + 20→IMU SDA, 21→SCL + P 5V, P GND; bottom D6-AN2… -->
  <rect x="624" y="508" width="340" height="150" class="box"/>
  <text x="794" y="578" text-anchor="middle" class="label">Arduino Mega 2560</text>
  <rect x="624" y="690" width="340" height="130" class="box"/>
  <text x="794" y="770" text-anchor="middle" class="label">Cytron MDDS30 - 30 A</text>
  <text x="794" y="794" text-anchor="middle" class="small">DIP s/w 10110111</text>
  <g id="arduino-cytron-nets" class="net">
    <path d="M698 622 L698 706"/>
    <path d="M746 622 L746 706"/>
    <path d="M794 622 L794 706"/>
    <path d="M842 622 L842 706"/>
    <path d="M890 622 L890 706"/>
  </g>
  <g id="arduino-pins-left">
    <circle cx="640" cy="524" r="5" class="pin"/>
    <circle cx="640" cy="546" r="5" class="pin"/>
    <text x="652" y="524" text-anchor="start" dominant-baseline="middle" class="pin-label">2</text>
    <text x="652" y="546" text-anchor="start" dominant-baseline="middle" class="pin-label">3</text>
  </g>
  <g id="arduino-pins-bottom">
    <text x="698" y="604" text-anchor="middle" class="pin-label">D6</text>
    <text x="746" y="604" text-anchor="middle" class="pin-label">D5</text>
    <text x="794" y="604" text-anchor="middle" class="pin-label">D4</text>
    <text x="842" y="604" text-anchor="middle" class="pin-label">D7</text>
    <text x="890" y="604" text-anchor="middle" class="pin-label">DX GND</text>
    <circle cx="698" cy="622" r="5" class="pin"/>
    <circle cx="746" cy="622" r="5" class="pin"/>
    <circle cx="794" cy="622" r="5" class="pin"/>
    <circle cx="842" cy="622" r="5" class="pin"/>
    <circle cx="890" cy="622" r="5" class="pin"/>
  </g>
  <g id="arduino-pins-right">
    <circle cx="948" cy="524" r="5" class="pin"/>
    <circle cx="948" cy="546" r="5" class="pin"/>
    <circle cx="948" cy="576" r="5" class="pin"/>
    <circle cx="948" cy="598" r="5" class="pin"/>
    <circle cx="948" cy="620" r="5" class="pin"/>
    <circle cx="948" cy="642" r="5" class="pin"/>
    <text x="936" y="524" text-anchor="end" dominant-baseline="middle" class="pin-label">18</text>
    <text x="936" y="546" text-anchor="end" dominant-baseline="middle" class="pin-label">19</text>
    <text x="936" y="576" text-anchor="end" dominant-baseline="middle" class="pin-label">20</text>
    <text x="936" y="598" text-anchor="end" dominant-baseline="middle" class="pin-label">21</text>
    <text x="936" y="620" text-anchor="end" dominant-baseline="middle" class="pin-label">P 5V</text>
    <text x="936" y="642" text-anchor="end" dominant-baseline="middle" class="pin-label">P GND</text>
  </g>
  <g id="cytron-pins-top">
    <circle cx="698" cy="706" r="5" class="pin"/>
    <text x="698" y="724" text-anchor="middle" class="pin-label">AN2</text>
    <circle cx="746" cy="706" r="5" class="pin"/>
    <text x="746" y="724" text-anchor="middle" class="pin-label">AN1</text>
    <circle cx="794" cy="706" r="5" class="pin"/>
    <text x="794" y="724" text-anchor="middle" class="pin-label">IN1</text>
    <circle cx="842" cy="706" r="5" class="pin"/>
    <text x="842" y="724" text-anchor="middle" class="pin-label">IN2</text>
    <circle cx="890" cy="706" r="5" class="pin"/>
    <text x="890" y="724" text-anchor="middle" class="pin-label">GND</text>
  </g>
  <!-- P GND → DX GND tee (y=676); bus east to IMU GND vertical (x=1258) -->
  <g id="net-arduino-pgnd-cytron-gnd" class="net">
    <path d="M948 647 L948 676 L890 676" stroke-linejoin="miter" stroke-width="2.25"/>
    <path d="M890 676 L1258 676" stroke-linejoin="miter" stroke-width="2.25"/>
  </g>

  <path d="M794 434 L794 508" class="line arrow"/>
  <text x="808" y="474" class="small" fill="#b45309">5 V</text>

  <!-- IMU -->
  <rect x="992" y="362" width="340" height="130" class="box" rx="0" ry="0"/>
  <text x="1162" y="427" text-anchor="middle" class="label" dominant-baseline="middle">IMU</text>
  <g id="imu-pins-top">
    <text x="1066" y="380" text-anchor="middle" class="pin-label">PS0</text>
    <text x="1114" y="380" text-anchor="middle" class="pin-label">PS1</text>
    <text x="1162" y="380" text-anchor="middle" class="pin-label">INT</text>
    <text x="1210" y="380" text-anchor="middle" class="pin-label">ADR</text>
    <circle cx="1066" cy="398" r="5" class="pin"/>
    <circle cx="1114" cy="398" r="5" class="pin"/>
    <circle cx="1162" cy="398" r="5" class="pin"/>
    <circle cx="1210" cy="398" r="5" class="pin"/>
  </g>
  <g id="imu-pins-bottom">
    <text x="1066" y="458" text-anchor="middle" class="pin-label">SDA</text>
    <text x="1114" y="458" text-anchor="middle" class="pin-label">SCL</text>
    <text x="1162" y="458" text-anchor="middle" class="pin-label">RST</text>
    <text x="1210" y="458" text-anchor="middle" class="pin-label">Vin</text>
    <text x="1258" y="458" text-anchor="middle" class="pin-label">GND</text>
    <circle cx="1066" cy="476" r="5" class="pin"/>
    <circle cx="1114" cy="476" r="5" class="pin"/>
    <circle cx="1162" cy="476" r="5" class="pin"/>
    <circle cx="1210" cy="476" r="5" class="pin"/>
    <circle cx="1258" cy="476" r="5" class="pin"/>
  </g>
  <g id="net-arduino-imu-i2c">
    <path class="net-i2c" d="M953 576 L1066 576 L1066 481" stroke-linejoin="miter"/>
    <path class="net-i2c" d="M953 598 L1114 598 L1114 481" stroke-linejoin="miter"/>
  </g>
  <!-- IMU Vin → 5 V rail; Arduino P 5V tees into vertical at (1210,620) -->
  <g id="net-imu-vin-rail-5v" class="line-power">
    <path d="M1210 481 L1210 1169 L1061 1169" stroke-linejoin="miter" stroke-width="1.5"/>
    <path d="M953 620 L1210 620" stroke-linejoin="miter" stroke-width="1.5"/>
  </g>
  <!-- IMU GND → GND rail: same L as Vin; stroke matches motor GND nets -->
  <g id="net-imu-gnd-rail" class="net">
    <path d="M1258 481 L1258 1133 L1061 1133" stroke-linejoin="miter" stroke-width="2.25"/>
  </g>

  <!-- Motors: 240×150; C2,C1,V,GND column with ~25px edge margin; 30px between pins -->
  <rect x="549" y="880" width="240" height="150" class="box"/>
  <text x="669" y="955" text-anchor="middle" class="label">Motor Left</text>
  <g id="motor-left-pins">
    <circle cx="588" cy="905" r="5" class="pin"/>
    <circle cx="588" cy="935" r="5" class="pin"/>
    <circle cx="588" cy="965" r="5" class="pin"/>
    <circle cx="588" cy="995" r="5" class="pin"/>
    <text x="600" y="905" text-anchor="start" dominant-baseline="middle" class="pin-label">C2</text>
    <text x="600" y="935" text-anchor="start" dominant-baseline="middle" class="pin-label">C1</text>
    <text x="600" y="965" text-anchor="start" dominant-baseline="middle" class="pin-label">V</text>
    <text x="600" y="995" text-anchor="start" dominant-baseline="middle" class="pin-label">GND</text>
  </g>
  <g id="net-motor-left-c2-arduino-3" class="net-motor-left">
    <!-- Wire leaves C2 pad at left edge (583,…), not center—avoids stroke through circle -->
    <path d="M583 905 L490 905 L490 546 L635 546" stroke-linejoin="miter"/>
  </g>
  <g id="net-motor-left-c1-arduino-2" class="net-motor-left net-motor-dash">
    <!-- C1 (583,935) → pin 2; vertical at x=468 so it runs parallel to C2→3 net at x=490 -->
    <path d="M583 935 L468 935 L468 524 L635 524" stroke-linejoin="miter"/>
  </g>
  <rect x="799" y="880" width="240" height="150" class="box"/>
  <text x="919" y="955" text-anchor="middle" class="label">Motor Right</text>
  <g id="motor-right-pins">
    <circle cx="1000" cy="905" r="5" class="pin"/>
    <circle cx="1000" cy="935" r="5" class="pin"/>
    <circle cx="1000" cy="965" r="5" class="pin"/>
    <circle cx="1000" cy="995" r="5" class="pin"/>
    <text x="988" y="905" text-anchor="end" dominant-baseline="middle" class="pin-label">C2</text>
    <text x="988" y="935" text-anchor="end" dominant-baseline="middle" class="pin-label">C1</text>
    <text x="988" y="965" text-anchor="end" dominant-baseline="middle" class="pin-label">V</text>
    <text x="988" y="995" text-anchor="end" dominant-baseline="middle" class="pin-label">GND</text>
  </g>
  <g id="net-motor-right-c2-arduino-19" class="net-motor-right">
    <!-- pin 19 aligned with pin 3 spacing (546); bus at x=1134 -->
    <path d="M1005 905 L1134 905 L1134 546 L953 546" stroke-linejoin="miter"/>
  </g>
  <g id="net-motor-right-c1-arduino-18" class="net-motor-right net-motor-dash">
    <!-- pin edge 1005 (mirror of left 583); bus at x=1156; pin 18 at (953,524) -->
    <path d="M1005 935 L1156 935 L1156 524 L953 524" stroke-linejoin="miter"/>
  </g>

  <!-- Power strip: full span under both motors; extra gap below motors -->
  <rect x="549" y="1092" width="526" height="118" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" rx="6"/>
  <rect x="563" y="1124" width="498" height="18" rx="3" ry="3" class="rail-gnd"/>
  <rect x="563" y="1160" width="498" height="18" rx="3" ry="3" class="rail-5v"/>
  <text x="812" y="1133" text-anchor="middle" dominant-baseline="middle" class="rail-cap">GND</text>
  <text x="812" y="1169" text-anchor="middle" dominant-baseline="middle" class="rail-cap">5 V</text>

  <!-- V outer bus (468 / 1156 like C1), GND inner (490 / 1134 like C2); rails unchanged -->
  <g id="net-motor-left-v-rail-5v" class="line-power">
    <path d="M583 965 L468 965 L468 1169 L563 1169" stroke-linejoin="miter" stroke-width="1.5"/>
  </g>
  <g id="net-motor-left-gnd-rail" class="net">
    <path d="M583 995 L490 995 L490 1133 L563 1133" stroke-linejoin="miter" stroke-width="2.25"/>
  </g>
  <g id="net-motor-right-v-rail-5v" class="line-power">
    <path d="M1005 965 L1156 965 L1156 1169 L1061 1169" stroke-linejoin="miter" stroke-width="1.5"/>
  </g>
  <g id="net-motor-right-gnd-rail" class="net">
    <path d="M1005 995 L1134 995 L1134 1133 L1061 1133" stroke-linejoin="miter" stroke-width="2.25"/>
  </g>

  <path d="M669 820 L669 880" class="line arrow"/>
  <path d="M919 820 L919 880" class="line arrow"/>
  <text x="645" y="838" text-anchor="middle" class="small" font-size="10px" fill="#334155">MLA</text>
  <text x="693" y="838" text-anchor="middle" class="small" font-size="10px" fill="#334155">MLB</text>
  <text x="895" y="838" text-anchor="middle" class="small" font-size="10px" fill="#334155">MRA</text>
  <text x="943" y="838" text-anchor="middle" class="small" font-size="10px" fill="#334155">MRB</text>
</svg>
