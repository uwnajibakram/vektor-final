<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540">
  <defs>
    <marker id="mk" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#334155"/>
    </marker>
    <marker id="mkd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/>
    </marker>
    <style>
      .imp { fill: #fff; stroke: #334155; stroke-width: 2; }
      .vpu { fill: #fefefe; stroke: #334155; stroke-width: 2; stroke-dasharray: 5 4; }
      .plan { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 5 5; }
      .group { fill: none; stroke: #0f172a; stroke-width: 2; stroke-dasharray: 4 4; }
      .t { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .ts { font: 500 9.5px ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .ti { font: 700 12px ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .ar { stroke: #334155; stroke-width: 1.85; fill: none; marker-end: url(#mk); }
      .ard { stroke: #475569; stroke-width: 1.85; fill: none; stroke-dasharray: 6 4; marker-end: url(#mkd); }
      .ar2 { stroke: #475569; stroke-width: 1.7; fill: none; stroke-dasharray: 4 4; marker-end: url(#mkd); }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#fafafa"/>

  <text x="520" y="28" text-anchor="middle" class="ti">Figure 2  Perception to actuation pipeline (midterm-style)</text>
  <text x="520" y="46" text-anchor="middle" class="ts">
    Solid: on Jetson · Dashed outline: runs on camera Myriad&nbsp;X · Dotted: SLAM / Nav2 / fused layers wired in ROS 2 in later phases (now integrated on Vektor).
  </text>

  <!-- costmap_2d group background -->
  <rect class="group" x="628" y="58" width="370" height="168" rx="10"/>
  <text x="808" y="78" text-anchor="middle" class="ts">Nav2 layered costmaps (costmap_2d)</text>

  <!-- Lane 1 depth -->
  <rect class="imp" x="40" y="95" width="108" height="44" rx="5"/>
  <text x="94" y="112" text-anchor="middle" class="t">Stereo pair</text>
  <text x="94" y="126" text-anchor="middle" class="ts">L/R mono</text>

  <rect class="vpu" x="180" y="95" width="130" height="44" rx="5"/>
  <text x="245" y="112" text-anchor="middle" class="t">Rectify + disparity</text>
  <text x="245" y="126" text-anchor="middle" class="ts">on VPU</text>

  <rect class="imp" x="338" y="95" width="118" height="44" rx="5"/>
  <text x="397" y="112" text-anchor="middle" class="t">Depth map</text>
  <text x="397" y="126" text-anchor="middle" class="ts">Z = fB/d</text>

  <rect class="plan" x="660" y="95" width="118" height="44" rx="5"/>
  <text x="719" y="118" text-anchor="middle" class="t">Obstacle layer</text>

  <path class="ar" d="M 148 117 L 178 117"/>
  <path class="ar" d="M 310 117 L 336 117"/>
  <path class="ar" d="M 456 117 L 658 117"/>
  <text x="530" y="108" class="ts">project to 2D</text>

  <!-- Lane 2 detection -->
  <rect class="imp" x="40" y="175" width="108" height="44" rx="5"/>
  <text x="94" y="198" text-anchor="middle" class="t">RGB sensor</text>

  <rect class="vpu" x="180" y="175" width="130" height="44" rx="5"/>
  <text x="245" y="198" text-anchor="middle" class="t">Myriad X inference</text>
  <text x="245" y="210" text-anchor="middle" class="ts">YOLO / SCRFD</text>

  <rect class="imp" x="338" y="175" width="140" height="44" rx="5"/>
  <text x="408" y="194" text-anchor="middle" class="t">Spatial detection</text>
  <text x="408" y="208" text-anchor="middle" class="ts">2D box + XYZ (mm)</text>

  <rect class="plan" x="660" y="175" width="118" height="44" rx="5"/>
  <text x="719" y="198" text-anchor="middle" class="t">Semantic layer</text>

  <path class="ar" d="M 148 197 L 178 197"/>
  <path class="ar" d="M 310 197 L 336 197"/>
  <path class="ar" d="M 478 197 L 658 197"/>

  <!-- depth feeds detection -->
  <path class="ar" d="M 397 139 L 397 175"/>
  <text x="405" y="162" class="ts">fuse</text>

  <!-- Lane 3 SLAM -->
  <rect class="vpu" x="40" y="268" width="108" height="44" rx="5"/>
  <text x="94" y="286" text-anchor="middle" class="t">OAK-D IMU</text>
  <text x="94" y="300" text-anchor="middle" class="ts">BNO085 class</text>

  <rect class="plan" x="180" y="265" width="160" height="50" rx="5"/>
  <text x="260" y="286" text-anchor="middle" class="t">RTAB-Map</text>
  <text x="260" y="302" text-anchor="middle" class="ts">RGB-D + graph</text>

  <path class="ard" d="M 148 290 L 178 290"/>
  <path class="ard" d="M 320 117 L 340 150 L 200 150 L 200 265"/>
  <text x="210" y="142" class="ts">RGB + depth</text>

  <!-- Nav2 -->
  <rect class="plan" x="820" y="248" width="150" height="56" rx="6"/>
  <text x="895" y="272" text-anchor="middle" class="t">Nav2</text>
  <text x="895" y="288" text-anchor="middle" class="ts">DWB · planners</text>

  <path class="ar2" d="M 760 180 L 800 200 L 820 260"/>
  <path class="ar2" d="M 340 290 L 820 276"/>
  <text x="520" y="278" class="ts">map + odom</text>

  <!-- Actuation row -->
  <rect class="plan" x="820" y="360" width="150" height="44" rx="5"/>
  <text x="895" y="384" text-anchor="middle" class="t">cmd_vel</text>

  <rect class="imp" x="580" y="360" width="190" height="44" rx="5"/>
  <text x="675" y="384" text-anchor="middle" class="t">Arduino ’ MDDS30 ’ motors</text>

  <rect class="plan" x="360" y="360" width="170" height="44" rx="5"/>
  <text x="445" y="384" text-anchor="middle" class="t">Wheel odometry</text>

  <path class="ar" d="M 820 382 L 772 382"/>
  <path class="ar" d="M 580 382 L 530 382"/>
  <path class="ar" d="M 895 304 L 895 360"/>
  <text x="902" y="338" class="ts">serial</text>

  <!-- odom ’ slam -->
  <path class="ar" d="M 445 360 L 445 310 L 340 310"/>
  <text x="360" y="340" class="ts">odom</text>

  <!-- Legend -->
  <rect class="imp" x="40" y="450" width="28" height="14" rx="2"/>
  <text x="78" y="461" class="ts">Host / Jetson node</text>
  <rect class="vpu" x="240" y="450" width="28" height="14" rx="2"/>
  <text x="278" y="461" class="ts">On-camera (Myriad X)</text>
  <rect class="plan" x="430" y="450" width="28" height="14" rx="2"/>
  <text x="468" y="461" class="ts">ROS integration / tuning</text>

  <text x="40" y="500" class="ts">
    Numbers from midterm: ~15 fps dual OAK on Orin Nano, 640×400 stereo, depth clipped at 10 m, default spatial depth gate 1005000 mm.
    Latency sketch: stereo ~10 ms (VPU) + Nav2 cycle ~20 ms + serial ~5 ms Ò ~75 ms coarse budget on the critical path.
  </text>
</svg>
